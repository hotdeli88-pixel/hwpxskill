name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke (스킬 폴더 실행, 설치 없이)
        run: |
          python skills/hwpxskill/scripts/hwpx.py --version
          python skills/hwpxskill/scripts/hwpx.py analyze tests/fixtures/gian_general.hwpx
          python skills/hwpxskill/scripts/hwpx.py fill tests/fixtures/gian_general.hwpx -d tests/fixtures/gian_general_values.json -o out.hwpx --render none --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and run
        run: |
          python -m pip install dist/*.whl
          cd /tmp && hwpxskill --version && hwpxskill doctor
