# PyPI 배포 — GitHub 릴리스를 발행하면 실행된다.
# 처음 한 번 PyPI에서 Trusted Publisher 를 등록해야 한다:
#   PyPI → Your projects(또는 Publishing) → Add a new pending publisher
#   Owner: hotdeli88-pixel, Repository: hwpxskill, Workflow: publish.yml, Environment: pypi
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
